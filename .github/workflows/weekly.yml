name: Weekly

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: StrykerJS on packages/format and packages/citations
        run: pnpm test:mutation
      - name: cargo-mutants on nb-fs
        run: |
          cargo install cargo-mutants --locked
          cargo mutants --manifest-path apps/desktop/src-tauri/Cargo.toml -p nb-fs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: |
            reports/mutation/
            apps/desktop/src-tauri/mutants.out/

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check advisories
      # The Typst advisories are ignored in deny.toml with a reason each
      # (ADR-0056). cargo-deny says `advisory-not-detected` once one no longer
      # applies; fail then, so the exception is removed, not forgotten.
      - name: Fail on advisory exceptions that no longer apply
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check advisories 2>&1 | tee "$RUNNER_TEMP/deny.log"
          if grep -q "advisory-not-detected" "$RUNNER_TEMP/deny.log"; then
            echo "::error::An ignored advisory no longer applies. Remove it from deny.toml (ADR-0056)."
            exit 1
          fi
      - name: Report the latest releases of the crates behind those exceptions
        run: |
          {
            echo "### Latest releases (ADR-0056 lists what each exception waits for)"
            for crate in typst hayagriva citationberg syntect two-face rustybuzz ttf-parser; do
              cargo search "$crate" --limit 1 | head -1
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
