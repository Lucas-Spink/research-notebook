[package]
name = "nb-preview"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
csv = "=1.4.0"
flate2 = "=1.1.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
serde_json = "1"
thiserror = "2"
nb-fs = { path = "../nb-fs", version = "0.1.0" }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "=3.27.0"
tiff = "=0.11.3"
