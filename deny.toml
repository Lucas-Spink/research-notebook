# cargo-deny configuration. Protected path: changes need maintainer review.

[graph]
all-features = true

[advisories]
yanked = "deny"
# All six ignored IDs below are "unmaintained", not known vulnerabilities,
# and all are transitive-only via Tauri 2.11.5 (the newest stable, non-alpha
# release) - none are direct dependencies of this project, and no safe
# upgrade is available on stable Tauri 2.x for either cluster. Revisit when
# Tauri bumps the dependencies named below. (S0-T09)
#
# unic-ucd-ident, unic-ucd-version, unic-char-property, unic-char-range,
# unic-common: the unmaintained rust-unic project, pulled in by
# tauri-utils's urlpattern ^0.3 dependency.
#
# proc-macro-error: pulled in by the GTK/glib bindings that
# tauri-runtime-wry depends on for Linux; present in Cargo.lock even
# though this project does not currently target Linux.
#
# paste: unmaintained (archived by its author), pulled transitively by
# `specta` 2.0.0-rc.25 via `tauri-specta` (S1-T05). No known vulnerability
# and no safe upgrade exists — `specta`/`tauri-specta` have no stable
# release compatible with Tauri 2 yet (only the rc.25 line). Revisit when
# specta drops paste or stabilises.
ignore = [
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
