# cargo-deny configuration. Protected path: changes need maintainer review.

[graph]
all-features = true

[advisories]
yanked = "deny"
# All six ignored IDs below are "unmaintained", not known vulnerabilities,
# and all are transitive-only via Tauri 2.11.5 (the newest stable, non-alpha
# release) - none are direct dependencies of this project, and no safe
# upgrade is available on stable Tauri 2.x for either cluster. Revisit when
# Tauri bumps the dependencies named below. (S0-T09)
#
# unic-ucd-ident, unic-ucd-version, unic-char-property, unic-char-range,
# unic-common: the unmaintained rust-unic project, pulled in by
# tauri-utils's urlpattern ^0.3 dependency.
#
# proc-macro-error: pulled in by the GTK/glib bindings that
# tauri-runtime-wry depends on for Linux; present in Cargo.lock even
# though this project does not currently target Linux.
#
# paste: unmaintained (archived by its author), pulled transitively by
# `specta` 2.0.0-rc.25 via `tauri-specta` (S1-T05). No known vulnerability
# and no safe upgrade exists — `specta`/`tauri-specta` have no stable
# release compatible with Tauri 2 yet (only the rc.25 line). Revisit when
# specta drops paste or stabilises.
#
# Typst chain (S6-T06, ADR-0056). The application links Typst (through
# `nb-export`) to write the PDF/A export. Six advisories apply to crates only
# it brings in. Each is ignored by ID, which cargo-deny cannot narrow further,
# so the reason names the crate and why its code is not reachable from
# untrusted input. The fixed template, the files the compiler is served and
# the embedded-only font set are held in place by
# `crates/nb-export/tests/template_surface.rs`. cargo-deny warns
# `advisory-not-detected` once an ignored advisory no longer applies, and the
# weekly job fails on that warning, so each exception is removed as soon as the
# upstream fix is in the lockfile. ADR-0056 lists what to wait for.
ignore = [
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0436",
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 via typst > hayagriva > citationberg. It parses only CSL styles given to Typst's bibliography(); the fixed template has none and the compiler serves no XML (ADR-0056). Remove when typst moves to a citationberg built on quick-xml >= 0.41." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4, as RUSTSEC-2026-0194: reachable only through a CSL style, and none is ever given to Typst (ADR-0056). Remove with it." },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 via syntect, for raw-text highlighting. It reads syntax sets compiled into the binary, never a file or user data (ADR-0056). Unmaintained, not a vulnerability. Remove when syntect or two-face stop using bincode 1." },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust 0.4.5 via syntect. It reads .sublime-syntax text only for custom syntaxes passed to raw(); the fixed template passes none (ADR-0056). Unmaintained, not a vulnerability. Remove when syntect moves to a maintained YAML parser." },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 via typst-layout and krilla: text shaping. Unmaintained, no known vulnerability; the fonts are the ones embedded in the binary (ADR-0056). Remove when typst moves to harfrust or a maintained rustybuzz." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 via fontdb and typst: parses font files. Unmaintained, no known vulnerability; only the fonts embedded in the binary are loaded, no system or user fonts (ADR-0056). Remove when typst moves to a maintained font parser." },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
